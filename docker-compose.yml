services:
  # Backend service - Node.js Express API
  backend:
    build: ./backend
    container_name: weather-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
    networks:
      - weather-network

  # Frontend service - Nginx serving static files
  frontend:
    build: ./frontend
    container_name: weather-frontend
    ports:
      - "3000:80"  # Map host port 3000 to container port 80
    depends_on:
      - backend
    networks:
      - weather-network

# Define a custom network for service communication
networks:
  weather-network:
    driver: bridge